<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Pingzhang Xu</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
</head>
<body>
    <main>
        <h1 class="projects-title">Projects</h1>

        <section class="project-explorer" aria-labelledby="explorer-title">
            <h2 id="explorer-title">Explore projects by year</h2>
            <label class="search-label" for="project-search">Search all project details</label>
            <input class="searchBar" id="project-search" type="search" aria-label="Search projects" placeholder="Search projects…" autocomplete="off">
            <p id="filter-status" class="filter-status" aria-live="polite"></p>
            <div class="chart-container">
                <svg id="projects-pie-plot" viewBox="-50 -50 100 100" role="group" aria-label="Projects by year pie chart"></svg>
                <ul class="legend" aria-label="Filter projects by year"></ul>
            </div>
        </section>
        <div class="projects" aria-live="polite"></div>
    </main>
</body>
</html>
